<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pharmacy - System Analytics Matrix</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/analytics.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="app-container">
        <div id="global-sidebar-target"></div>
        <div class="main-content">
            <header class="top-bar">
                <div class="page-title"><h1>System Analytics Engine</h1></div>
                <div class="top-bar-right"><div class="clock-widget" id="live-clock-display"></div></div>
            </header>
            <main class="content-wrapper">
                
                <section class="overview-analytics-summary-strip">
                    <div class="metric-mini-node"><h5>Asset Capacity Index</h5><p id="an-node-total">0</p></div>
                    <div class="metric-mini-node"><h5>In Stock Status</h5><p id="an-node-optimal" style="color:var(--secondary);">0</p></div>
                    <div class="metric-mini-node"><h5>Reorder Flag Counts</h5><p id="an-node-low" style="color:var(--warning);">0</p></div>
                    <div class="metric-mini-node"><h5>Safety Purge Actions Required</h5><p id="an-node-expired" style="color:var(--danger);">0</p></div>
                </section>

                <section class="analytics-charts-grid-layout">
                    <div class="chart-frame-panel">
                        <h3>Therapeutic Classification Allocation Percentages</h3>
                        <div class="chart-box"><canvas id="analyticsPieComponent"></canvas></div>
                    </div>
                    <div class="chart-frame-panel">
                        <h3>Physical Inventory Volumes by Unit Allocations</h3>
                        <div class="chart-box"><canvas id="analyticsBarComponent"></canvas></div>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="js/common.js"></script>
    <script src="js/analytics.js"></script>
</body>
</html>
